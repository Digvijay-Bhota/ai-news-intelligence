name: Workers CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # Cancel superseded runs on a PR when a new commit is pushed to it (only the
  # latest commit's result matters there). Never cancel push-to-main or manual
  # runs: each of those must always run to completion and record its own result.
  group: workers-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Workers validate (typecheck + test)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No secrets, no deployment credentials, no production access of any kind.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies (reproducible, from committed lockfile)
        working-directory: workers
        run: npm ci

      - name: Typecheck
        working-directory: workers
        run: npm run typecheck

      - name: Test
        working-directory: workers
        run: npm test

      # Gemini quality-comparison runner and request-ledger tests. They need a
      # real filesystem, so they run under vitest.ledger.config.ts instead of
      # the Workers pool. Every network call is mocked and every test uses a
      # temporary ledger; the real user-level ledger is refused under Vitest.
      - name: Ledger and runner tests (temporary ledgers, mocked network)
        working-directory: workers
        run: npm run test:ledger

      - name: Verify the real user-level request ledger was not created
        run: |
          # Same home directory the runner uses: the OS user database, not $HOME.
          ledger="$(getent passwd "$(id -un)" | cut -d: -f6)/.local/state/ai-news-intelligence"
          if [ -e "$ledger" ]; then
            echo "::error::Tests created or modified the real request ledger at $ledger"
            exit 1
          fi
          echo "Real request ledger absent as expected: $ledger"
